name: evals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per case per arm
        default: "10"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check.sh

  # The plugin commands need a login even though they call no model.
  mod:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate mods/usage-status
      - run: claude plugin test mods/usage-status

  eval:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      # --threshold 0 reports failing cases without failing the job.
      # Without a pinned model, CI runs cost half as much and scored lower than
      # local runs. Pin the model so CI scores compare with evals/snapshot.md.
      - name: Run evals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude plugin eval . --trust-plugin --no-publish \
            --model claude-opus-5-5 \
            --runs "${{ inputs.runs || '10' }}" -j 4 --threshold 0 \
            --output-dir evals/results/ci
      - name: Summarize
        run: |
          bash scripts/snapshot.sh evals/results/ci/aggregate-result.json
          cat evals/snapshot.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/ci
